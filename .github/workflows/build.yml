name: Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  ext-build:
    env:
      EXPO_PUBLIC_BREEZ_API_KEY: ${{ secrets.EXPO_PUBLIC_BREEZ_API_KEY }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Specify node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ext/package-lock.json

      - name: Use npm 11 (lockfile tooling matches developers / EAS)
        run: npm install -g npm@11.6.2

      - name: Install node_modules
        run: cd ext && npm ci

      - name: Run build
        run: cd ext && NODE_ENV=production npm run build

      - name: Get package version
        id: package_version
        run: echo "VERSION=$(cd ext && node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Get branch name
        id: branch_name
        run: echo "BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Sanitize branch name
        id: sanitized_branch_name
        run: echo "BRANCH=${{ steps.branch_name.outputs.BRANCH }}" | sed 's/\//-/g' >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: layerzwallet-${{ steps.package_version.outputs.VERSION }}-${{ steps.sanitized_branch_name.outputs.BRANCH }}
          path: ext/build/
          if-no-files-found: error

  # Electrobun always builds for the host platform/arch, so we need one runner per target OS.
  # `bun run build` => `vite build && electrobun build --env=stable`; the distributable output
  # lands in desktop/artifacts/ (flat, {channel}-{os}-{arch}- prefixed). The mac config sets
  # neither codesign nor notarize, so unsigned stable builds succeed without Apple credentials.
  # Electrobun builds for the host arch only, so each macOS arch needs its own runner.
  # Both pin macOS 15 (avoids macos-latest drift): macos-15 = arm64, macos-15-intel = x64
  # (the last Intel image GitHub offers, supported until ~Aug 2027).
  desktop-build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15 # Apple Silicon
            arch: arm64
          - runner: macos-15-intel # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Only the EXPO_PUBLIC_* vars the desktop build actually inlines/consumes (Vite + breez adapter + Garden provider + Aptabase analytics).
    env:
      EXPO_PUBLIC_BREEZ_API_KEY: ${{ secrets.EXPO_PUBLIC_BREEZ_API_KEY }}
      EXPO_PUBLIC_GARDEN_APP_ID: ${{ secrets.EXPO_PUBLIC_GARDEN_APP_ID }}
      EXPO_PUBLIC_APTABASE_KEY: ${{ secrets.EXPO_PUBLIC_APTABASE_KEY }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Specify node version
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: desktop
        run: bun run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: desktop/artifacts/**
          if-no-files-found: error

  desktop-build-linux:
    runs-on: ubuntu-latest # x64
    timeout-minutes: 30
    # Only the EXPO_PUBLIC_* vars the desktop build actually inlines/consumes (Vite + breez adapter + Garden provider + Aptabase analytics).
    env:
      EXPO_PUBLIC_BREEZ_API_KEY: ${{ secrets.EXPO_PUBLIC_BREEZ_API_KEY }}
      EXPO_PUBLIC_GARDEN_APP_ID: ${{ secrets.EXPO_PUBLIC_GARDEN_APP_ID }}
      EXPO_PUBLIC_APTABASE_KEY: ${{ secrets.EXPO_PUBLIC_APTABASE_KEY }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Specify node version
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: desktop
        run: bun run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: desktop/artifacts/**
          if-no-files-found: error

  desktop-build-windows:
    runs-on: windows-latest # x64
    timeout-minutes: 30
    # Only the EXPO_PUBLIC_* vars the desktop build actually inlines/consumes (Vite + breez adapter + Garden provider + Aptabase analytics).
    env:
      EXPO_PUBLIC_BREEZ_API_KEY: ${{ secrets.EXPO_PUBLIC_BREEZ_API_KEY }}
      EXPO_PUBLIC_GARDEN_APP_ID: ${{ secrets.EXPO_PUBLIC_GARDEN_APP_ID }}
      EXPO_PUBLIC_APTABASE_KEY: ${{ secrets.EXPO_PUBLIC_APTABASE_KEY }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Specify node version
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: desktop
        run: bun run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: desktop/artifacts/**
          if-no-files-found: error
