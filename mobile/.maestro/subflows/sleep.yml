appId: com.layerzwallet.mobile
---
# Sleep for a given number of milliseconds
# If TIMEOUT is not provided, sleep for 3 seconds
# If TIMEOUT is provided, sleep for the given number of milliseconds

- evalScript: await new Promise(resolve => setTimeout(resolve, TIMEOUT || 3000));
- evalScript: ${console.log('sleeping', TIMEOUT || 3000 );}
- evalScript: ${output.counter = Date.now()}
- evalScript: ${console.log(output.counter);}
- repeat:
    while:
      true: ${(Date.now() - output.counter) < (TIMEOUT || 3000)}
    commands:
      - evalScript: ${console.log((Date.now() - output.counter) / 1000)}
- evalScript: ${console.log('slept for', (Date.now() - output.counter), 'ms');}
