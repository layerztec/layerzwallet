appId: com.layerzwallet.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: skip-dev-client.yml
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Import Wallet'
    timeout: 150000
- tapOn: 'Import Wallet'
- waitForAnimationToEnd

# Wrong mnemonic, run this flow only on android. On ios maestro fails with "Input text wrong TEXT FAILED"
# why it still can enter mnemonic? IDK
- runFlow:
    when:
      platform: 'android'
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: 'ImportWalletMnemonicInput'
      - eraseText
      - inputText: 'wrong'
      - tapOn:
          point: 10%,50% # to remove focus from the keyboard
      - waitForAnimationToEnd
      - tapOn:
          id: 'ImportWalletImportButton'
      - assertVisible: 'Invalid mnemonic seed'
      # now to clean the input field we go back and tap "Import Wallet" again
      - runFlow:
          file: back.yml
      - tapOn: 'Import Wallet'
      - waitForAnimationToEnd

# Correct mnemonic
- waitForAnimationToEnd
- tapOn:
    id: 'ImportWalletMnemonicInput'
- eraseText
- inputText: ${MNEMONIC}
- tapOn:
    point: 10%,50% # to remove focus from the keyboard
- waitForAnimationToEnd
- tapOn:
    id: 'ImportWalletImportButton'
- extendedWaitUntil:
    visible: 'Create Password'
    timeout: 300_000 # 5 min

# Create password
- tapOn:
    id: 'EnterPasswordInput'
- eraseText
- inputText:
    text: '123456'
- tapOn:
    id: 'RepeatPasswordInput'
- eraseText
- inputText:
    text: '123456'
- tapOn:
    point: 10%,10% # to remove focus from the keyboard
- tapOn:
    id: 'CreatePasswordButton'
- waitForAnimationToEnd

# Accept terms of service
- extendedWaitUntil:
    visible: 'Wallet created\nsuccessfully'
    timeout: 10000

- assertVisible: 'Wallet created\nsuccessfully'
- assertVisible: 'You are now ready to access your wallet\nand unlock Bitcoin Layerz 2 potential'

# Check the backup recovery phrase checkbox
- assertVisible:
    id: 'BackupRecoveryPhraseCheckbox'
- tapOn:
    id: 'BackupRecoveryPhraseCheckbox'

# Check the terms of service checkbox
- assertVisible:
    id: 'TermsOfServiceCheckbox'
- tapOn:
    id: 'TermsOfServiceCheckbox'

# Verify the button is enabled and tap it
- assertVisible:
    text: "Let's go"
    enabled: true
- tapOn: "Let's go"
- waitForAnimationToEnd

# Wait for home screen with Send & Receive buttons
- assertVisible:
    id: 'SendButton'
- assertVisible:
    id: 'ReceiveButton'
