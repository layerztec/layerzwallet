appId: com.layerzwallet.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: skip-dev-client.yml
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Import Wallet'
    timeout: 150000
- tapOn: 'Import Wallet'

# Wrong mnemonic, run this flow only on android. On ios maestro fails with "Input text wrong TEXT FAILED"
# why it still can enter mnemonic? IDK
- runFlow:
    when:
      platform: 'android'
    commands:
      - tapOn:
          id: 'ImportWalletMnemonicInput'
      - inputText: 'wrong'
      - tapOn: 'Import wallet' # to remove focus from the keyboard
      - tapOn:
          id: 'ImportWalletImportButton'
      - assertVisible: 'Invalid mnemonic seed'
      - tapOn:
          id: 'ImportWalletMnemonicInput'
      - eraseText

# Correct mnemonic
- tapOn:
    id: 'ImportWalletMnemonicInput'
- inputText: ${MNEMONIC}
- tapOn: 'Import wallet' # to remove focus from the keyboard
- tapOn:
    id: 'ImportWalletImportButton'
- extendedWaitUntil:
    visible: 'Choose a 4-digit PIN'
    timeout: 300_000 # 5 min

# Create PIN by tapping keypad buttons (1234)
- waitForAnimationToEnd

# Enter PIN: 1-2-3-4
- tapOn: '1'
- waitForAnimationToEnd
- tapOn: '2'
- waitForAnimationToEnd
- tapOn: '3'
- waitForAnimationToEnd
- tapOn: '4'
- waitForAnimationToEnd

# Confirm PIN: 1-2-3-4
- extendedWaitUntil:
    visible: 'Confirm your PIN'
    timeout: 5000
- tapOn: '1'
- waitForAnimationToEnd
- tapOn: '2'
- waitForAnimationToEnd
- tapOn: '3'
- waitForAnimationToEnd
- tapOn: '4'
- waitForAnimationToEnd

# Accept terms of service
- tapOn: 'I Agree'
- waitForAnimationToEnd

# Wait for home screen with Send & Receive buttons
- assertVisible:
    id: 'SendButton'
- assertVisible:
    id: 'ReceiveButton'
