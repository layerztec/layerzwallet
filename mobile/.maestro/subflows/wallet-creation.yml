appId: com.layerzwallet.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: skip-dev-client.yml

- waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Create Wallet'
    timeout: 15000
- waitForAnimationToEnd

- tapOn: 'Create Wallet'
- waitForAnimationToEnd
- tapOn: 'Continue'
- waitForAnimationToEnd
- tapOn:
    id: 'ManualBackupSettingsRow'
- waitForAnimationToEnd
- tapOn:
    id: 'ManualBackupContinueButton'

- extendedWaitUntil:
    visible: 'Make sure to write it down as shown here. You have to verify this later.'
    timeout: 150000

# First wait for the loading to complete
- extendedWaitUntil:
    notVisible: 'Creating your wallet...'
    timeout: 60000

# Then verify the Continue button is available and enabled
- assertVisible:
    id: 'VerifyButton'
    enabled: true

- tapOn:
    id: 'VerifyButton'

- waitForAnimationToEnd
- tapOn:
    id: 'ValidationIntroContinueButton'

# Now proceed to the create PIN screen
- repeat:
    while:
      notVisible: 'Create a PIN'
    commands:
      - tapOn: 'Continue'
      - waitForAnimationToEnd

# Create PIN by tapping keypad buttons (123456)
- extendedWaitUntil:
    visible: 'Create a PIN'
    timeout: 10000
- waitForAnimationToEnd

# Enter PIN: 1-2-3-4-5-6
- tapOn: '1'
- waitForAnimationToEnd
- tapOn: '2' 
- waitForAnimationToEnd
- tapOn: '3'
- waitForAnimationToEnd
- tapOn: '4'
- waitForAnimationToEnd
- tapOn: '5'
- waitForAnimationToEnd
- tapOn: '6'
- waitForAnimationToEnd

# Confirm PIN: 1-2-3-4-5-6
- extendedWaitUntil:
    visible: 'Confirm your PIN'
    timeout: 5000
- tapOn: '1'
- waitForAnimationToEnd
- tapOn: '2'
- waitForAnimationToEnd
- tapOn: '3'
- waitForAnimationToEnd
- tapOn: '4'
- waitForAnimationToEnd
- tapOn: '5'
- waitForAnimationToEnd
- tapOn: '6'
- waitForAnimationToEnd

# Accept terms of service
- tapOn: 'I Agree'
- waitForAnimationToEnd

# Wait for home screen with Send & Receive buttons
- assertVisible: 'Send'
- assertVisible: 'Receive'
