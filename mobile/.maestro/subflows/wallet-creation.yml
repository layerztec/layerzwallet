appId: com.layerzwallet.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: skip-dev-client.yml

- waitForAnimationToEnd

# Wait for the app to fully initialize and determine the step
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'Get Started'
    timeout: 30000

- tapOn: 'Get Started'

- extendedWaitUntil:
    visible: 'Create New Wallet'
    timeout: 15000

- tapOn: 'Create New Wallet'

- extendedWaitUntil:
    visible: 'Write down these 12 words in numerical order and keep them in a secure place. Never share them with anyone.'
    timeout: 150000

# Wait for the loading to complete - increase timeout and add more specific conditions
- extendedWaitUntil:
    notVisible: 'Creating your wallet...'
    timeout: 180000

# Additional wait to ensure UI is stable
- waitForAnimationToEnd

# Then verify the Continue button is available and enabled
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 60000

# Ensure wallet creation is fully complete before proceeding
- extendedWaitUntil:
    notVisible: 'Loading'
    timeout: 30000

# Now proceed to the enter password screen
- repeat:
    while:
      notVisible:
        id: 'EnterPasswordInput'
    commands:
      - tapOn: 'Continue'
      - waitForAnimationToEnd

# Create password
- tapOn:
    id: 'EnterPasswordInput'
- inputText:
    text: '123456' # Password
- tapOn:
    id: 'RepeatPasswordInput'
- inputText:
    text: '123456' # Confirm password
- tapOn:
    point: 10%,10% # to remove focus from the keyboard
- tapOn:
    id: 'CreatePasswordButton'
- waitForAnimationToEnd

# Accept terms of service
- tapOn: 'I Agree'
- waitForAnimationToEnd

# Wait for home screen with Send & Receive buttons
- assertVisible: 'Send'
- assertVisible: 'Receive'
