appId: com.layerzwallet.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: skip-dev-client.yml

- waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Create Wallet'
    timeout: 15000
- waitForAnimationToEnd

- tapOn: 'Create Wallet'
- waitForAnimationToEnd
- tapOn: 'Continue'

# Wait for navigation to complete and the mnemonic screen to appear
- extendedWaitUntil:
    visible: 'This is your \nrecovery phrase'
    timeout: 60000

# Verify we see the instruction text
- assertVisible: 'Make sure to write it down as shown here. You have to verify this later.'

# Verify the "I wrote it down!" button is available and enabled
- assertVisible:
    id: 'VerifyButton'
    enabled: true

- tapOn:
    id: 'VerifyButton'

- waitForAnimationToEnd
- tapOn:
    id: 'ValidationIntroContinueButton'

# Now proceed to the enter password screen
- repeat:
    while:
      notVisible:
        id: 'EnterPasswordInput'
    commands:
      - tapOn: 'Continue'
      - waitForAnimationToEnd

# Create password
- tapOn:
    id: 'EnterPasswordInput'
- inputText:
    text: '123456' # Password
- tapOn:
    id: 'RepeatPasswordInput'
- inputText:
    text: '123456' # Confirm password
- tapOn:
    point: 10%,10% # to remove focus from the keyboard
- tapOn:
    id: 'CreatePasswordButton'
- waitForAnimationToEnd

# Accept terms of service
- tapOn: 'I Agree'
- waitForAnimationToEnd

# Wait for home screen with Send & Receive buttons
- assertVisible:
    id: 'SendButton'
- assertVisible:
    id: 'ReceiveButton'
