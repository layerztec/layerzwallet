appId: com.layerzwallet.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: skip-dev-client.yml

- waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Create Wallet'
    timeout: 15000
- waitForAnimationToEnd

- tapOn: 'Create Wallet'
- waitForAnimationToEnd
- tapOn: 'Continue'

# Wait for navigation to complete and the mnemonic screen to appear
- extendedWaitUntil:
    visible: 'This is your \nrecovery phrase'
    timeout: 60000

# Verify we see the instruction text
- assertVisible: 'Make sure to write it down as shown here. You have to verify this later.'

# Verify the "Skip" button is available and enabled
- assertVisible:
    id: 'SkipButton'
    enabled: true

- tapOn:
    id: 'SkipButton'

- waitForAnimationToEnd

# Now proceed to the enter password screen
- repeat:
    while:
      notVisible: 'Wallet created\nsuccessfully'
    commands:
      - tapOn: 'Continue'
      - waitForAnimationToEnd

# Accept terms of service
- extendedWaitUntil:
    visible: 'Wallet created\nsuccessfully'
    timeout: 10000

# Verify success message
- assertVisible: 'Wallet created\nsuccessfully'
- assertVisible: 'You are now ready to access your wallet\nand unlock Bitcoin Layerz 2 potential'

# Check the backup recovery phrase checkbox
- assertVisible:
    id: 'BackupRecoveryPhraseCheckbox'
- tapOn:
    id: 'BackupRecoveryPhraseCheckbox'

# Check the terms of service checkbox
- assertVisible:
    id: 'TermsOfServiceCheckbox'
- tapOn:
    id: 'TermsOfServiceCheckbox'

# Verify the button is enabled and tap it
- assertVisible:
    text: "Let's go"
    enabled: true
- tapOn: "Let's go"
- waitForAnimationToEnd

# Wait for home screen with Send & Receive buttons
- assertVisible:
    id: 'SendButton'
- assertVisible:
    id: 'ReceiveButton'
