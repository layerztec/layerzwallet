appId: com.layerzwallet.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: skip-dev-client.yml

- waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Create Wallet'
    timeout: 15000
- waitForAnimationToEnd

- tapOn: 'Create Wallet'
- waitForAnimationToEnd
- tapOn: 'Continue'
- waitForAnimationToEnd
- tapOn:
    id: 'ManualBackupSettingsRow'
- waitForAnimationToEnd
- tapOn:
    id: 'ManualBackupContinueButton'

- extendedWaitUntil:
    visible: 'Make sure to write it down as shown here. You have to verify this later.'
    timeout: 150000

# First wait for the loading to complete
- extendedWaitUntil:
    notVisible: 'Creating your wallet...'
    timeout: 60000

# Then verify the Continue button is available and enabled
- assertVisible:
    id: 'VerifyButton'
    enabled: true

- tapOn:
    id: 'VerifyButton'

- waitForAnimationToEnd
- tapOn:
    id: 'ValidationIntroContinueButton'

# Now proceed to the create PIN screen
- repeat:
    while:
      notVisible: 'Choose a 4-digit PIN'
    commands:
      - tapOn: 'Continue'
      - waitForAnimationToEnd

# Create PIN by tapping keypad buttons (1234)
- extendedWaitUntil:
    visible: 'Choose a 4-digit PIN'
    timeout: 10000
- waitForAnimationToEnd

# Test PIN mismatch scenario first
# Enter PIN: 1-2-3-4
- tapOn: '1'
- waitForAnimationToEnd
- tapOn: '2'
- waitForAnimationToEnd
- tapOn: '3'
- waitForAnimationToEnd
- tapOn: '4'
- waitForAnimationToEnd

# Confirm with wrong PIN: 5-6-7-8 to test mismatch
- extendedWaitUntil:
    visible: 'Confirm your PIN'
    timeout: 5000
- tapOn: '5'
- waitForAnimationToEnd
- tapOn: '6'
- waitForAnimationToEnd
- tapOn: '7'
- waitForAnimationToEnd
- tapOn: '8'
- waitForAnimationToEnd

# Verify error message appears
- assertVisible: 'PINs do not match'

# Wait for auto-reset (2.5 seconds + animation time)
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: 'Choose a 4-digit PIN'
    timeout: 5000

# Now create PIN correctly
# Enter PIN: 1-2-3-4
- tapOn: '1'
- waitForAnimationToEnd
- tapOn: '2'
- waitForAnimationToEnd
- tapOn: '3'
- waitForAnimationToEnd
- tapOn: '4'
- waitForAnimationToEnd

# Confirm PIN: 1-2-3-4
- extendedWaitUntil:
    visible: 'Confirm your PIN'
    timeout: 5000
- tapOn: '1'
- waitForAnimationToEnd
- tapOn: '2'
- waitForAnimationToEnd
- tapOn: '3'
- waitForAnimationToEnd
- tapOn: '4'
- waitForAnimationToEnd

# Accept terms of service
- tapOn: 'I Agree'
- waitForAnimationToEnd

# Wait for home screen with Send & Receive buttons
- assertVisible: 'Send'
- assertVisible: 'Receive'
