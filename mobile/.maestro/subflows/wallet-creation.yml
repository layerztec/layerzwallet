appId: com.layerzwallet.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: skip-dev-client.yml

# The dev client finishes loading after skip-dev-client returns. A one-shot
# visibility check skips onboarding, then the intro appears and SendButton is absent.
# Retries can also reopen straight into home, so wait until one of those two screens is up.
- repeat:
    times: 20
    while:
      notVisible:
        id: 'SendButton'
    commands:
      - runFlow:
          when:
            visible: 'Create Wallet'
          commands:
            - tapOn: 'Create Wallet'
            - waitForAnimationToEnd
            - tapOn: 'Continue'

            # Wait for navigation to complete and the mnemonic screen to appear
            - extendedWaitUntil:
                visible: 'Your recovery phrase'
                timeout: 60000

            # Verify we see the instruction text
            - assertVisible: 'Make sure to write it down as shown here. You have to verify this later.'

            # Verify the "Skip" button is available and enabled
            - assertVisible:
                id: 'SkipButton'
                enabled: true

            - tapOn:
                id: 'SkipButton'

            # Skip goes directly to ToS screen (no "Continue" screen). Wait for ToS to be ready.
            - extendedWaitUntil:
                visible: 'Wallet created\nsuccessfully'
                timeout: 15000

            # Verify success message
            - assertVisible: 'Wallet created\nsuccessfully'
            - assertVisible:
                id: 'TosSubtitle'

            # Check the backup recovery phrase checkbox
            - assertVisible:
                id: 'BackupRecoveryPhraseCheckbox'
            - tapOn:
                id: 'BackupRecoveryPhraseCheckbox'
            - waitForAnimationToEnd

            # Check the terms of service checkbox
            - assertVisible:
                id: 'TermsOfServiceCheckbox'
            - tapOn:
                id: 'TermsOfServiceCheckbox'
            - waitForAnimationToEnd

            # Wait for button to become enabled and visible
            - extendedWaitUntil:
                visible:
                  id: 'LetsGoButton'
                  enabled: true
                timeout: 10000

            # Tap the button
            - tapOn:
                id: 'LetsGoButton'
            - waitForAnimationToEnd

            # After wallet creation, the modal starts minimized, so we need to tap on a network card to expand it.
            - runFlow:
                when:
                  visible:
                    id: 'network-bitcoin'
                commands:
                  - tapOn:
                      id: 'network-bitcoin'
                  - waitForAnimationToEnd

      # Intro is not up yet. Poll instead of failing the home-screen assertion.
      - runFlow:
          when:
            notVisible: 'Create Wallet'
          commands:
            - evalScript: ${output.counter = Date.now()}
            - repeat:
                while:
                  true: ${(Date.now() - output.counter) < 1000}
                commands:
                  - evalScript: ${output.noop = true}

# Wait for home screen with Send & Receive buttons
- assertVisible:
    id: 'SendButton'
- assertVisible:
    id: 'ReceiveButton'
