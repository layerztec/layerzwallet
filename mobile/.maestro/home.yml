appId: com.layerzwallet.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: subflows/skip-dev-client.yml
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'GetStartedButton'
    timeout: 45000
- tapOn:
    id: 'GetStartedButton'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Welcome to Layerz'
    timeout: 30000
