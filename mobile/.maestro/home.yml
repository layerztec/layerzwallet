appId: com.layerzwallet.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: subflows/skip-dev-client.yml
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'GetStartedButton'
    commands:
      - tapOn:
          id: 'GetStartedButton'
      - waitForAnimationToEnd
- assertVisible: 'Welcome to Layerz'
