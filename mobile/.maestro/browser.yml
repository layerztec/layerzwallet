appId: com.layerzwallet.mobile
---
- runFlow: subflows/wallet-creation.yml

# Switch to Rootstock network
- runFlow:
    file: subflows/network-switch.yml
    env:
      NETWORK: 'rootstock'

# Tap on network card to expand modal (buttons are only visible when expanded)
- tapOn:
    id: 'activeNetwork-rootstock'
- waitForAnimationToEnd

- tapOn:
    id: 'ExplorerButton'
- waitForAnimationToEnd
- longPressOn:
    id: 'DappBrowserAddressBar'
- eraseText
#
- inputText: 'https://metamask.github.io/test-dapp/'
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: 'unwhitelist'
- waitForAnimationToEnd
- extendedWaitUntil: # wait for page to load
    visible: 'E2E Test Dapp'

- tapOn: 'Use Layerz Wallet'
- waitForAnimationToEnd
- scroll
- tapOn: 'Connect'
- waitForAnimationToEnd

- assertVisible: 'Account Access Request'
- scroll # Extend the popup
- tapOn: 'Allow'
- waitForAnimationToEnd
- assertNotVisible: 'Account Access Request'

# signing v4

- scrollUntilVisible:
    element: Sign Typed Data V4
    timeout: 90000
    speed: 50
    centerElement: true
- copyTextFrom:
    id: signTypedDataV4Result
- evalScript: ${console.log(JSON.stringify(maestro.copiedText));}
- assertTrue: ${maestro.copiedText == ""}
- tapOn:
    id: signTypedDataV4
- scrollUntilVisible:
    element: Allow
- tapOn: Allow
- extendedWaitUntil:
    notVisible: 'Processing...'
    timeout: 60000

# instead of sleeping (maestro doesnt have sleep) we scroll to make the element centered
# (we are waiting for signature to be complete and provided to a webpage)
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: signTypedDataV4Result
    centerElement: true
- waitForAnimationToEnd

- copyTextFrom:
    id: signTypedDataV4Result
- evalScript: ${console.log(JSON.stringify(maestro.copiedText));}
- assertTrue: ${maestro.copiedText != ""}
