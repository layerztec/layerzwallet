appId: com.layerzwallet.mobile
---
- runFlow: subflows/wallet-creation.yml

# Ensure modal is expanded (wallet-creation.yml should have already done this, but just in case)
- tapOn:
    id: 'activeNetwork-bitcoin'
- waitForAnimationToEnd

# Navigate to Settings
- tapOn:
    id: 'SettingsButton'

# Scroll to the bottom to find the Self Test button as emu screen can be small
- scrollUntilVisible:
    element:
      id: 'SelfTestButton'
    direction: DOWN

# Navigate to Self Test
- tapOn:
    id: 'SelfTestButton'
- waitForAnimationToEnd

# Run the self test
- tapOn:
    id: 'RunSelfTestButton'
- waitForAnimationToEnd

# Wait for success message
- extendedWaitUntil:
    visible:
      id: 'SelfTestSuccess'
    timeout: 29000
