appId: com.layerzwallet.mobile
---
- runFlow: subflows/wallet-creation.yml

# Test deep link to Bitcoin Send with recipient address using layerzwallet:// scheme
- openLink: 'layerzwallet://send/btc?toAddress=bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Recipient Address'
    timeout: 15000

- assertVisible: 'bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh'

# Test deep link with both address and amount using layerzwallet:// scheme
- runFlow: subflows/back.yml
- openLink: 'layerzwallet://send/btc?toAddress=bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh&amount=0.001'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Recipient Address'
    timeout: 15000

- assertVisible: 'bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh'
- assertVisible: '0.001'

# Test deep link using bitcoin:// scheme (BIP21 format)
- runFlow: subflows/back.yml
- openLink: 'bitcoin:bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh?amount=0.002'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Recipient Address'
    timeout: 15000

- assertVisible: 'bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh'
- assertVisible: '0.002'

# Test BIP21 with label parameter
- runFlow: subflows/back.yml
- openLink: 'bitcoin:bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh?amount=0.003&label=Test%20Payment'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Recipient Address'
    timeout: 15000

- assertVisible: 'bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh'
- assertVisible: '0.003'
