# Testplan:
# - restore the wallet
# - send 1 sat via Spark
# - check that balance decreased

appId: com.layerzwallet.mobile
jsEngine: graaljs
---
- runFlow:
    file: subflows/wallet-restore.yml
    env:
      MNEMONIC: ${MAESTRO_TEST_MNEMONIC}

# switch network
- runFlow:
    file: subflows/network-switch.yml
    env:
      NETWORK: 'spark'
# wait for the balance to load
- assertVisible:
    id: 'LayerBalance'
- extendedWaitUntil:
    notVisible: '— BTC'
    timeout: 60000

- copyTextFrom:
    id: 'LayerActualBalance'
- evalScript: ${output.balance = maestro.copiedText}
- evalScript: ${console.log(output.balance);}
- evalScript: ${console.log(parseFloat(output.balance));}
# guard against NaN:
- evalScript: ${if (parseFloat(output.balance) > 0) {} else throw new Error("bad balance = " + output.balance)  }

# ok, balance copied, lets send it so hardcoded address from our 2nd account
- tapOn:
    id: 'SendButton'
- tapOn:
    id: 'send-address-input'
- inputText: 'spark1pgssyjcyyypuufme5g6n4rg7avcxkx029am5ccpfn63d5ryr6d308m0j4akqhx'
- runFlow:
    file: subflows/sleep.yml
    env:
      TIMEOUT: 1000
- tapOn:
    id: 'send-address-next-button'
- waitForAnimationToEnd
- tapOn:
    id: 'send-amount-acc-input'
    point: 10%,10% # avoid max button
- inputText: '0.00000001'
- tapOn:
    id: 'send-amount-acc-next-button'
- waitForAnimationToEnd
- assertVisible: '0.00000001 BTC'
- tapOn:
    id: 'send-confirm-button'
- extendedWaitUntil:
    visible:
      id: 'send-success-text'
    timeout: 29000
- tapOn: 'Back to Wallet'
- runFlow: # sleeping till balance updates
    file: subflows/sleep.yml
    env:
      TIMEOUT: 12000

# checking that balance is updated
- copyTextFrom:
    id: 'LayerActualBalance'
- evalScript: ${output.balance2 = maestro.copiedText}
- evalScript: ${console.log(output.balance2);}
- evalScript: ${console.log(parseFloat(output.balance2));}
# check:
- evalScript: ${if (output.balance > output.balance2) {} else throw new Error("bad balance = " + output.balance + " vs " + output.balance2)  }
