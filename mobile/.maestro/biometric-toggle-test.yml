appId: com.layerzwallet.mobile
---
# Create wallet first
- runFlow:
    file: subflows/wallet-creation.yml

# Navigate to Settings and test biometric toggle
- tapOn:
    id: SettingsButton
- assertVisible:
    id: SettingsScreenTitle

# Wait for settings to load
- waitForAnimationToEnd:
    timeout: 2000

# Look for the Biometrics text in the Security section
# Tap on the Biometrics row to enable it
- tapOn:
    text: 'Biometrics'
    optional: true

# Wait for any processing or alerts
- waitForAnimationToEnd:
    timeout: 3000

# Handle any potential alert dialogs (all optional)
- tapOn:
    text: 'Allow'
    optional: true
- tapOn:
    text: 'OK'
    optional: true
- tapOn:
    text: 'Enable'
    optional: true
- tapOn:
    text: 'Simulating successful biometric setup for testing'
    optional: true
- tapOn:
    text: 'OK'
    optional: true
- tapOn:
    text: 'Not Available'
    optional: true
- tapOn:
    text: 'OK'
    optional: true
