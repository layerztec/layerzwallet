# Testplan:
# - create a wallet
# - check if we can swap bitcoin -> liquid

appId: com.layerzwallet.mobile
jsEngine: graaljs
---
- runFlow: subflows/wallet-creation.yml

# Navigate to Swaps tab (2nd tab: Layerz | Swaps | Explorer). Native tab bar does not expose testID.
- tapOn:
    point: '50%, 95%'
- waitForAnimationToEnd
- assertVisible: 'Select target network'
- tapOn:
    id: 'AmountInput'
- eraseText
- inputText: '0.1'
- tapOn: # close keyboard
    id: 'ToLabel'
- tapOn:
    id: 'ToNetworkButton'
- waitForAnimationToEnd
- assertVisible: 'Swap to'
- assertVisible:
    id: 'SwapTarget-rootstock'
- tapOn:
    id: 'SwapTarget-liquid'
- waitForAnimationToEnd
- assertVisible: 'Swap BTC to Liquid'
- tapOn:
    id: 'SwapButton'
- assertVisible: 'Not enough balance'
