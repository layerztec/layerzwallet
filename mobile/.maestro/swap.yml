# Testplan:
# - Navigate to transfer flow
# - Select testnet pair: tL-BTC -> BTC (Botanix Testnet) via Fake service
# - Enter amount 0.01
# - Wait for quote from Fake service
# - Continue to confirm screen
# - Wait for loading (executeTransfer + getSendQuote)
# - Verify confirm details: Rate, Fee, Est. time, Expiry, Provider=Fake
# - Confirm transfer
# - Verify success screen
# - Dismiss success → verify inputs are cleared (no accidental double-submit)
# - Error case: amount=1 triggers TestError
# - Second swap with 0.02: verify full flow works again after state reset

appId: com.layerzwallet.mobile
---
- runFlow: subflows/wallet-creation.yml
# - launchApp

# Wait for home screen to fully load (need Settings access first)
- extendedWaitUntil:
    visible:
      id: 'SettingsButton'
    timeout: 30000

# Enable testnets in Settings → Tools → App Settings
- tapOn:
    id: 'SettingsButton'
- extendedWaitUntil:
    visible:
      id: 'ToolsButton'
    timeout: 5000
- tapOn:
    id: 'ToolsButton'
- extendedWaitUntil:
    visible: 'App Settings'
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'SettingOption-showTestnets-ON'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'SettingOption-showTestnets-ON'

# Navigate back: Tools → Settings → Home
# Tap back button (top-left chevron) since 'back' gesture doesn't work with custom headers
- tapOn:
    id: 'BackButton'
- extendedWaitUntil:
    visible:
      id: 'ToolsButton'
    timeout: 5000
- tapOn:
    id: 'BackButton'
- extendedWaitUntil:
    visible:
      id: 'NetworkSwitcherTrigger'
    timeout: 10000

# Collapse the home modal so the tab bar is visible (modal is full-screen after wallet-creation).
- tapOn:
    id: 'NetworkSwitcherTrigger'
- waitForAnimationToEnd

# Switch to Transfer tab
- tapOn:
    id: 'Tab-swaps'
    optional: true
- tapOn:
    text: 'Transfer'
    optional: true

# Wait for transfer input screen to load
- extendedWaitUntil:
    visible: 'Transfer'
    timeout: 15000

# Select send asset: tL-BTC (Liquid Testnet)
- tapOn:
    id: 'TransferSend-asset-pill'
- extendedWaitUntil:
    visible: 'Select'
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'TransferAsset-native:liquid_testnet'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'TransferAsset-native:liquid_testnet'
- waitForAnimationToEnd

# Select receive asset: BTC (Botanix Testnet)
- tapOn:
    id: 'TransferReceive-asset-pill'
- extendedWaitUntil:
    visible: 'Select'
    timeout: 5000
- tapOn:
    id: 'SelectAssetSearch'
- inputText: 'botanix'
- extendedWaitUntil:
    visible:
      id: 'TransferAsset-native:botanix_testnet'
    timeout: 15000
- tapOn:
    id: 'TransferAsset-native:botanix_testnet'
- waitForAnimationToEnd

# Enter send amount
- tapOn:
    id: 'TransferSend-input'
- inputText: '0.01'

# Dismiss numeric keyboard by tapping on non-input area (hideKeyboard doesn't work for iOS numeric keyboard)
- tapOn: 'Receive'

# Wait for quote to load and Continue button to become enabled
- extendedWaitUntil:
    visible:
      id: 'TransferContinueButton'
      enabled: true
    timeout: 15000

# Tap Continue
- tapOn:
    id: 'TransferContinueButton'
- waitForAnimationToEnd

# Wait for confirm screen to finish loading (executeTransfer in background)
- extendedWaitUntil:
    visible:
      id: 'TransferConfirmButton'
    timeout: 60000

# Verify confirm screen elements
- assertVisible:
    id: 'ConfirmSendBlock'
- assertVisible:
    id: 'ConfirmReceiveBlock'
- assertVisible:
    id: 'ConfirmRate'
- assertVisible:
    id: 'ConfirmFee'
- assertVisible:
    id: 'ConfirmEstTime'
- assertVisible:
    id: 'ConfirmExpiry'

# Verify it is the Fake transfer service
- assertVisible:
    id: 'ConfirmProvider'
- assertVisible: 'Fake'

# Confirm the transfer
- tapOn:
    id: 'TransferConfirmButton'

# Verify success screen appears
- extendedWaitUntil:
    notVisible:
      id: 'TransferConfirmButton'
    timeout: 15000
- waitForAnimationToEnd

# Dismiss success modal by tapping top of screen
- tapOn:
    point: '50%,10%'
- waitForAnimationToEnd

# --- Verify inputs are cleared after successful transfer (no double-submit) ---
- extendedWaitUntil:
    visible:
      id: 'TransferContinueButton'
      enabled: false
    timeout: 5000

# --- Error case: amount=1 triggers TestError ---
- tapOn:
    id: 'TransferSend-input'
- inputText: '1'

# Dismiss keyboard
- tapOn: 'Receive'

# Wait for quote error to appear
- extendedWaitUntil:
    visible:
      id: 'TransferQuoteError'
    timeout: 10000
- assertVisible: 'Fake: TestError'

# Verify Continue button is disabled
- assertVisible:
    id: 'TransferContinueButton'
    enabled: false

# --- Second swap: verify full flow works again after state reset ---
- tapOn:
    id: 'TransferSend-input'
- eraseText: 1
- inputText: '0.02'

# Dismiss keyboard
- tapOn: 'Receive'

# Wait for quote and Continue to become enabled
- extendedWaitUntil:
    visible:
      id: 'TransferContinueButton'
      enabled: true
    timeout: 15000

# Continue to confirm
- tapOn:
    id: 'TransferContinueButton'
- waitForAnimationToEnd

# Wait for confirm screen
- extendedWaitUntil:
    visible:
      id: 'TransferConfirmButton'
    timeout: 15000

# Confirm transfer
- tapOn:
    id: 'TransferConfirmButton'

# Verify success
- extendedWaitUntil:
    visible:
      id: 'TransferSuccessText'
    timeout: 15000

# Dismiss success
- tapOn:
    point: '50%,10%'
- waitForAnimationToEnd

# Verify inputs cleared again
- extendedWaitUntil:
    visible:
      id: 'TransferContinueButton'
      enabled: false
    timeout: 5000
