on:
  push:
    branches: ['master']

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

# TestFlight jobs still run `npm ci` on the worker; pin Node to match `eas.json`
# `build.base.node` so install matches production builds (see eas-cli#3589).
defaults:
  tools:
    node: '22.14.0'

jobs:
  build_ios:
    name: Build iOS app
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to Apple App Store
    needs: [build_ios]
    type: testflight
    params:
      platform: ios
      build_id: ${{ needs.build_ios.outputs.build_id }}
      changelog: "${{ github.commit_message || '' }}"
