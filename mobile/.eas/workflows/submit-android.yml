on:
  push:
    branches: ['master']
    paths:
      - mobile/**

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

# Submit jobs still run `npm ci` on the worker (see eas-cli#3589) and the
# `eas-build-pre-install` npm-upgrade hook in package.json is NOT executed on
# submit workers. So we pin to a Node version that ships with an npm >= 11.6.2
# that can parse our lockfile. Node 24.14.0 bundles npm 11.9.0, matching what
# developers use locally to regenerate package-lock.json.
defaults:
  tools:
    node: '24.14.0'

jobs:
  build_android:
    name: Build Android app
    type: build
    params:
      platform: android
      profile: production

  build_android_apk:
    name: Build Android release APK
    # Build the GitHub-release APK after the store build so both artifacts share the
    # same remote Android version bump from the production profile's autoIncrement.
    needs: [build_android]
    type: build
    params:
      platform: android
      profile: production-apk

  submit_android:
    name: Submit to Google Play Store
    needs: [build_android]
    type: submit
    params:
      platform: android
      build_id: ${{ needs.build_android.outputs.build_id }}
