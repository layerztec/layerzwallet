name: e2e-test-android

on:
  pull_request:
    branches: ['*'] # Run the E2E test workflow on every pull request.

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_android_for_e2e:
    type: build
    params:
      platform: android
      profile: preview

  maestro_test:
    needs: [build_android_for_e2e]
    type: maestro
    params:
      retries: 5
      build_id: ${{ needs.build_android_for_e2e.outputs.build_id }}
      flow_path:
        - .maestro/home.yml
        - .maestro/wallet-creation-and-selftest.yml
        - .maestro/receive.yml
        - .maestro/restore.yml
        - .maestro/browser.yml
        - .maestro/swap.yml
        - .maestro/biometric-toggle-test.yml

  upload_build_to_appetize:
    needs: [build_android_for_e2e]

    steps:
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ needs.build_android_for_e2e.outputs.build_id }}
      - name: Print artifact path
        run: |
          echo "Artifact path: ${{ steps.download_build.outputs.artifact_path }}"

      - name: Upload artifact to Appetize
        run: |
          set -euo pipefail
          ARTIFACT="${{ steps.download_build.outputs.artifact_path }}"
          if [ -z "${APPETIZE_API_KEY:-}" ]; then
            echo "APPETIZE_API_KEY is not set" >&2
            exit 1
          fi
          echo "Uploading $ARTIFACT to Appetize..."
          APPETIZE_RESPONSE=$(curl -fSL -X POST https://api.appetize.io/v1/apps \
            -H "X-API-KEY: $APPETIZE_API_KEY" \
            -F "file=@${ARTIFACT}" \
            -F "platform=android")
          echo "Appetize response: $APPETIZE_RESPONSE"
          APP_URL=$(echo "$APPETIZE_RESPONSE" | jq -r '.appURL')
          echo "App URL: $APP_URL"
          if [ -z "${EXPO_EAS_BUILD_UPLOADED_ENDPOINT:-}" ]; then
            echo "EXPO_EAS_BUILD_UPLOADED_ENDPOINT is not set" >&2
            exit 1
          fi
          echo "posting data to webhook..."
          echo '{
            "appURL": "'$APP_URL'",
            "git_commit_hash": "${{ needs.build_android_for_e2e.outputs.git_commit_hash }}",
            "platform": "${{ needs.build_android_for_e2e.outputs.platform }}"
          }' | curl -d @- "$EXPO_EAS_BUILD_UPLOADED_ENDPOINT"
